<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trạm Điều Phối Rác Tuấn Hùng · Smart Waste Big Data</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css?v=16">
  <script src="/assets/dashboard.js?v=16" defer></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">TH</div>
      <div>
        <div class="brand-name">TUẤN HÙNG</div>
        <small>SMART WASTE · BIG DATA</small>
      </div>
    </div>

    <nav aria-label="Điều hướng các bước nghiệp vụ">
      <button data-page="operations" class="selected">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </span>
        <span class="nav-text"><b>01 · Cảnh báo &amp; Điều xe</b><small>Cảm biến thùng rác · Thu gom</small></span>
      </button>
      <button data-page="analysis">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="7" rx="1"/><rect x="12" y="6" width="3" height="11" rx="1"/><rect x="17" y="13" width="3" height="4" rx="1"/></svg>
        </span>
        <span class="nav-text"><b>02 · Thống kê &amp; Biểu đồ</b><small>Cao điểm · Khu vực · Tài chính</small></span>
      </button>
      <button data-page="planning">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18"/><path d="M3 12h18"/><circle cx="12" cy="12" r="9"/></svg>
        </span>
        <span class="nav-text"><b>03 · Quy hoạch tự động</b><small>Thùng ±5L · Lịch · Đội xe</small></span>
      </button>
      <button data-page="finance">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
        </span>
        <span class="nav-text"><b>04 · Hóa đơn &amp; Thu phí</b><small>Đối soát ngân hàng · Nợ 5%</small></span>
      </button>
      <button data-page="health">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="7" height="6" rx="1.5"/><rect x="14" y="4" width="7" height="6" rx="1.5"/><rect x="3" y="14" width="7" height="6" rx="1.5"/><rect x="14" y="14" width="7" height="6" rx="1.5"/><path d="M10 7h4M10 17h4M6.5 10v4"/></svg>
        </span>
        <span class="nav-text"><b>05 · Hạ tầng Big Data</b><small>Kafka · Spark · HDFS · PG</small></span>
      </button>
    </nav>

    <div class="sidebar-card">
      <div class="sidebar-card-title">Quy mô hệ thống</div>
      <div class="sidebar-stats">
        <span><b>60</b> Khu dân cư</span>
        <span><b>3.600</b> Hộ gia đình</span>
        <span><b>10.800</b> Thùng IoT</span>
        <span><b>180–360</b> Xe gom</span>
      </div>
      <div class="sidebar-hotline">Hỗ trợ đối soát · <b>0392196240</b></div>
    </div>
  </aside>

  <main>
    <header class="control">
      <div class="clock-group">
        <span id="state" class="tag">ĐANG KẾT NỐI</span>
        <div class="clock-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span id="clock">—</span>
        </div>
      </div>
      <div class="actions">
        <button data-action="start" class="btn primary">▶ Bật demo</button>
        <button data-action="pause" class="btn">⏸ Tạm dừng</button>
        <button data-action="reset" class="btn reset-btn" title="Đưa toàn bộ dữ liệu PostgreSQL, Kafka và HDFS về đúng mốc chuẩn ban đầu">↺ Đặt lại demo</button>
      </div>
    </header>

    <div class="workspace">
      <section class="cycle-bar" aria-label="Vòng tròn nghiệp vụ khép kín">
        <div class="cycle-steps">
          <button type="button" class="cycle-step selected" data-step="operations">
            <span class="step-pill">01</span>
            <div><strong>Cảm biến &amp; Điều xe</strong><small>Báo đầy · Phân xe gần nhất</small></div>
          </button>
          <span class="cycle-arrow">→</span>
          <button type="button" class="cycle-step" data-step="analysis">
            <span class="step-pill">02</span>
            <div><strong>Thống kê khối lượng</strong><small>24h · 60 khu · Hiệu quả</small></div>
          </button>
          <span class="cycle-arrow">→</span>
          <button type="button" class="cycle-step" data-step="planning">
            <span class="step-pill">03</span>
            <div><strong>Quy hoạch Thùng · Xe</strong><small>±5L · ±24h · 1↔2 xe/khu</small></div>
          </button>
          <span class="cycle-arrow">→</span>
          <button type="button" class="cycle-step" data-step="finance">
            <span class="step-pill">04</span>
            <div><strong>Hóa đơn &amp; Thu phí</strong><small>Quá hạn 5% → Ngừng gom</small></div>
          </button>
          <span class="cycle-arrow">↺</span>
          <button type="button" class="cycle-step infra" data-step="health">
            <span class="step-pill">05</span>
            <div><strong>Kafka → Spark → HDFS</strong><small>Parquet 4 lớp · Postgres</small></div>
          </button>
        </div>
      </section>

      <div class="page-head">
        <div class="heading">
          <p id="eyebrow"></p>
          <h1 id="title"></h1>
          <p id="subtitle"></p>
        </div>
        <details id="guide-box" class="guide-box">
          <summary>💡 Gợi ý thuyết trình</summary>
          <div id="guide"></div>
        </details>
      </div>

      <section class="filters" aria-label="Bộ lọc dữ liệu">
        <label id="zone-wrap">Khu dân cư<select id="zone"><option value="0">Tất cả 60 khu</option></select></label>
        <label id="category-wrap">Loại rác<select id="category"><option value="">Tất cả 3 loại</option>
          <option value="organic">Hữu cơ (O)</option><option value="recycle">Tái chế (R)</option><option value="other">Còn lại (C)</option>
        </select></label>
        <label id="month-wrap">Kỳ tháng<input type="month" id="month" value="2026-10"></label>
        <label id="house-wrap">Mã hộ<input id="house" placeholder="VD: H-0001" maxlength="16"></label>
        <label id="filter-wrap">Trạng thái<select id="filter"></select></label>
      </section>

      <div id="notice" role="status"></div>
      <div id="content"></div>
    </div>
  </main>

  <div id="chart-tooltip" class="chart-tooltip" hidden></div>
</body>
</html>
