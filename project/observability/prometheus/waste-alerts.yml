groups:
  - name: waste-lab
    rules:
      - alert: WasteHealthExporterDown
        expr: up{job="waste-health"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Health exporter is unreachable
      - alert: WasteServiceUnreachable
        expr: waste_service_up == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'Endpoint {{ $labels.service }} is unreachable'
          description: A TCP/HTTP reachability check failed. Consult the incident log before diagnosing the cause.
      - alert: HdfsDataNodeMissing
        expr: waste_hdfs_live_datanodes < 3
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Fewer than three HDFS DataNodes are live
      - alert: HdfsUnderReplicated
        expr: waste_hdfs_under_replicated_blocks > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: HDFS has blocks with fewer live replicas than configured
      - alert: KafkaReplicaMissing
        expr: waste_kafka_under_replicated_partitions > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: A Kafka partition has fewer ISR members than replicas
      - alert: SensorSignalLost
        expr: waste_sensor_silent_bins > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: One or more bins stopped reporting
      - alert: HostMemoryPressure
        expr: waste_host_memory_available_bytes / waste_host_memory_total_bytes < 0.08
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Available host RAM is below eight percent
